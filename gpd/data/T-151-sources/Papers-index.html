<!DOCTYPE html>

<!--

Why is this here? Because if there is a simple symbolic link to the publication
page instead, then the publication page will load when someone visits
http://dna.caltech.edu/Papers, but almost all of the links to papers, which use
relative href links, will be broken. This fixes that problem. - Constantine
2012.06.17

-->

<html>

	<head>
		<title>DNA Group Publications</title>
		<meta HTTP-EQUIV="REFRESH" content="0; url=http://dna.caltech.edu/DNAresearch_publications.html">
	</head>

</html>
