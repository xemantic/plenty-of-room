version=0.1.1-SNAPSHOT
kotlin.code.style=official

# gradle
#org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC
#org.gradle.configuration-cache=true
#org.gradle.configuration-cache.parallel=true
#org.gradle.caching=true
org.gradle.parallel=true

# The Kotlin daemon OOMs under four or more concurrent agents even with 9 GB free, reporting
# `Not enough memory to run compilation`, `OutOfMemoryError: Java heap space`, `GC overhead
# limit exceeded`, or `Back-end (JVM) Internal error: Couldn't transform method node` on a file
# that compiled seconds earlier — all of which surface as `NoClassDefFoundError` on classes
# nobody touched, i.e. exactly like the P-7/P-10 build race and exactly like a broken test.
# A `-Dkotlin.daemon.jvmargs=` on the Gradle command line does not reach the daemon; the
# property has to be in `gradle.properties`, and putting it here means every `tools/*.sh`
# snapshot inherits it rather than each agent remembering to patch its own copy.
kotlin.daemon.jvmargs=-Xmx3g
